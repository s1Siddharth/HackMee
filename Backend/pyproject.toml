[project]
name = "datathon"
version = "0.1.0"
description = "Automated Insight Analyst - Datathon 2026"
requires-python = ">=3.11"
dependencies = [
    "streamlit",
    "streamlit-float",
    "pandas",
    "numpy",
    "openpyxl",
    "plotly",
    "openai>=1.0.0",
    "python-dotenv",
    "scikit-learn",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
